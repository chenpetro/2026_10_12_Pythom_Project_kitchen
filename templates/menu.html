{% extends "base.html" %}

{% block title %}Menu | Food Shop{% endblock %}

{% block styles %}
<style>
    .dish-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 1.5rem;
    }
    .dish { margin: 0; min-width: 0; }
    .dish img {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 4 / 3;
        object-fit: cover;
        border-radius: 6px;
    }
    .dish h2 { margin: 0.75rem 0 0.25rem; font-size: 1.25rem; }
    .dish p { margin: 0; color: var(--muted); }
    .dish-credit {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        color: var(--muted);
        font-size: 0.875rem;
    }
    @media (min-width: 576px) {
        .dish-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (min-width: 992px) {
        .dish-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
</style>
{% endblock %}

{% block content %}
    <h1>Ukrainian menu</h1>
    <div class="dish-grid">
        <figure class="dish">
            <img src="{{ url_for('static', filename='varenyky.jpg') }}" alt="Ukrainian varenyky filled with potatoes" width="960" height="640" decoding="async">
            <figcaption>
                <h2>Varenyky</h2>
                <p>Traditional filled dumplings.</p>
                <a class="dish-credit" href="https://commons.wikimedia.org/wiki/File:Varenyky_with_Potatoes_-_2026_-03.jpg">Photo credits and license</a>
            </figcaption>
        </figure>
        <figure class="dish">
            <img src="{{ url_for('static', filename='borsch.jpg') }}" alt="A bowl of red beetroot borsch served with sour cream" width="960" height="627" decoding="async">
            <figcaption>
                <h2>Borsch</h2>
                <p>Beetroot soup with vegetables.</p>
                <a class="dish-credit" href="https://commons.wikimedia.org/wiki/File:Borscht_served.jpg">Photo credits and license</a>
            </figcaption>
        </figure>
        <figure class="dish">
            <img src="{{ url_for('static', filename='salo.jpg') }}" alt="Pieces of cured pork fat, known as salo" width="960" height="820" decoding="async">
            <figcaption>
                <h2>Salo</h2>
                <p>Traditional cured pork fat.</p>
                <a class="dish-credit" href="https://commons.wikimedia.org/wiki/File:Sa%C5%82o.JPG">Photo credits and license</a>
            </figcaption>
        </figure>
        <figure class="dish">
            <img src="{{ url_for('static', filename='kvas.jpg') }}" alt="Bread kvas served in a glass" width="960" height="720" decoding="async">
            <figcaption>
                <h2>Kvas</h2>
                <p>A refreshing fermented bread drink.</p>
                <a class="dish-credit" href="https://commons.wikimedia.org/wiki/File:Mint_bread_kvas.jpg">Photo credits and license</a>
            </figcaption>
        </figure>
    </div>
{% endblock %}
